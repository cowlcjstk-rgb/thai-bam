backend:
  name: github
  repo: cowlcjstk-rgb/thai-bam
  branch: main
  base_url: https://thai-bam.pages.dev
  auth_endpoint: oauth
  commit_messages:
    create: "cms(create): {{collection}} {{slug}}"
    update: "cms(update): {{collection}} {{slug}}"
    delete: "cms(delete): {{collection}} {{slug}}"
    uploadMedia: "cms(media): upload {{path}}"
    deleteMedia: "cms(media): delete {{path}}"

site_url: https://thai-bam.pages.dev
display_url: https://thai-bam.pages.dev
locale: ko
media_folder: "public/uploads"
public_folder: "/uploads"
publish_mode: simple
show_preview_links: false

editor:
  preview: false

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: home
    label: 홈페이지 설정
    folder: src/content/home
    create: false
    delete: false
    slug: "{{slug}}"
    summary: "홈 문구/섹션/FAQ 관리"
    fields:
      - { label: "1. 상단 라벨", name: heroKicker, widget: string, hint: "예: THAILAND NIGHT GUIDE" }
      - { label: "2. 메인 제목", name: heroTitle, widget: string }
      - { label: "3. 소개 문구", name: heroDescription, widget: text }
      - { label: "3-1. 소개 문구 이미지", name: heroDescriptionImage, widget: image, required: false, hint: "문구 아래에 함께 노출할 이미지" }
      - { label: "3-2. 소개 문구 이미지 ALT", name: heroDescriptionImageAlt, widget: string, required: false, hint: "예: 태국 나이트라이프 메인 비주얼" }
      - { label: "4. 지역별 탐색 제목", name: areaSectionTitle, widget: string, required: false }
      - { label: "5. 지역별 탐색 설명", name: areaSectionDescription, widget: text, required: false }
      - { label: "6. 지역별 탐색 기본 접기", name: areaSectionCollapsed, widget: boolean, default: true, hint: "켜면 홈 접속 시 지역별 탐색 섹션이 접힌 상태로 시작됩니다." }
      - { label: "7. 가이드 정보 제목", name: seoBlockTitle, widget: string, required: false }
      - { label: "8. 가이드 정보 본문 1", name: seoBlockParagraph1, widget: text, required: false }
      - { label: "9. 가이드 정보 본문 2", name: seoBlockParagraph2, widget: text, required: false }
      - label: 카테고리 대표 글
        name: categoryHighlights
        widget: list
        required: false
        summary: "{{fields.category}} → {{fields.venueSlug}}"
        hint: "카테고리별 대표 글을 지정하세요. 지정하지 않으면 최신 글이 자동 노출됩니다."
        fields:
          - label: 카테고리
            name: category
            widget: select
            options:
              - { label: "KTV & Karaoke", value: ktv-karaoke }
              - { label: "Spa & Massage", value: spa-massage }
              - { label: "Club Reservation", value: club-reservation }
              - { label: "VIP Guide", value: vip-guide }
          - label: 대표 글 선택
            name: venueSlug
            widget: relation
            collection: venues
            search_fields: [title, slug]
            value_field: slug
            display_fields: [title, slug]
      - label: 지역별 탐색 카드 설정
        name: areaExplorerAreas
        widget: list
        required: false
        summary: "{{fields.area}}"
        hint: "리스트 순서대로 카드가 노출됩니다. 대표 글을 비우면 해당 지역의 최신 글 3개가 자동 표시됩니다."
        fields:
          - label: 지역
            name: area
            widget: select
            options:
              - { label: Bangkok, value: bangkok }
              - { label: Pattaya, value: pattaya }
              - { label: Chiang Mai, value: chiang-mai }
          - label: 대표 글(선택)
            name: venueSlugs
            widget: relation
            required: false
            collection: venues
            search_fields: [title, slug, area, category]
            value_field: slug
            display_fields: [title, area, category]
            multiple: true
      - label: 자주 묻는 질문
        name: faqItems
        widget: list
        required: false
        summary: "{{fields.question}}"
        fields:
          - { label: 질문, name: question, widget: string }
          - { label: 답변, name: answer, widget: text }

  - name: venues
    label: 업체 글 관리
    folder: src/content/venues
    create: true
    slug: "{{fields.slug}}"
    summary: "{{title}} - {{area}} / {{category}}"
    editor:
      preview: false
    sortable_fields: [updatedAt, order, title, area, category]
    fields:
      - { label: "1. 업체명", name: title, widget: string }
      - label: URL 슬러그
        name: slug
        widget: string
        required: true
        hint: "영문 소문자/숫자/하이픈만 입력 (예: sample-ktv-bangkok)"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "슬러그는 영문 소문자, 숫자, 하이픈(-)만 사용할 수 있습니다."
      - label: "2. 지역"
        name: area
        widget: select
        options:
          - { label: Bangkok, value: bangkok }
          - { label: Pattaya, value: pattaya }
          - { label: Chiang Mai, value: chiang-mai }
      - label: "3. 카테고리"
        name: category
        widget: select
        options:
          - { label: "KTV & Karaoke", value: ktv-karaoke }
          - { label: "Spa & Massage", value: spa-massage }
          - { label: "Club Reservation", value: club-reservation }
          - { label: "VIP Guide", value: vip-guide }
      - { label: "4. 노출 여부", name: visible, widget: boolean, default: true }
      - { label: "5. 추천 노출", name: featured, widget: boolean, default: false }
      - { label: "6. 정렬 순서", name: order, widget: number, default: 100 }
      - { label: "7. 수정일", name: updatedAt, widget: datetime }
      - { label: "8. 요약 소개", name: shortDescription, widget: text, hint: "목록에 보일 짧은 소개 (40~180자 권장)" }
      - { label: "9. 상단 본문 소개", name: introBody, widget: text, required: false, hint: "상세 페이지 상단에 노출되는 소개 본문 (80자 이상 권장)" }
      - { label: "10. SEO 제목", name: seoTitle, widget: string }
      - { label: "11. SEO 설명", name: seoDescription, widget: text }
      - { label: "12. 대표 이미지", name: thumbnail, widget: image }
      - { label: "13. 대표 이미지 ALT", name: thumbnailAlt, widget: string, hint: "이미지 내용을 자연스럽게 설명하세요. 예: 방콕 KTV 메인 라운지 전경" }
      - label: "14. 대표 이미지 정렬"
        name: thumbnailPosition
        widget: select
        default: center
        options:
          - { label: 상단 기준, value: top }
          - { label: 중앙 기준, value: center }
          - { label: 하단 기준, value: bottom }
      - label: "15. 갤러리"
        name: gallery
        widget: list
        required: false
        fields:
          - { label: 이미지, name: image, widget: image }
          - { label: 이미지 ALT, name: alt, widget: string, hint: "예: 파타야 스파 내부 테라피 룸" }
      - { label: "16. 영업시간", name: openingHours, widget: string, required: false, hint: "예: 19:00-02:00" }
      - { label: "17. 가격대", name: priceRange, widget: text, required: false, hint: "여러 줄 입력 가능\n예시:\n1번 옵션은 1000바트\n2번 옵션은 2000바트\n3번 옵션은 3000바트" }
      - label: "18. 이용 순서 타임라인"
        name: usageSteps
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: 단계 제목, name: title, widget: string }
          - { label: 단계 설명, name: detail, widget: text }
      - { label: "19. 위치 설명", name: addressText, widget: string, required: false, hint: "예: 파타야 터미널21 부근" }
      - { label: "20. 구글맵 링크", name: googleMapUrl, widget: string, required: false, hint: "공유 링크 붙여넣기 가능 (예: https://maps.app.goo.gl/...)" }
      - { label: "21. 위도(선택)", name: latitude, widget: number, required: false, value_type: float, hint: "정확한 핀 고정용 (예: 13.7024493)" }
      - { label: "22. 경도(선택)", name: longitude, widget: number, required: false, value_type: float, hint: "정확한 핀 고정용 (예: 100.58403)" }
      - { label: "23. 카카오 문의 링크", name: kakaoUrl, widget: string, required: false }
      - { label: "24. 라인 문의 링크", name: lineUrl, widget: string, required: false }
      - { label: "25. 상세 본문", name: body, widget: markdown, hint: "상세 안내 본문을 입력하세요. (지도는 본문 아래 자동 노출)" }

  - name: banners
    label: 배너 관리
    folder: src/content/banners
    create: true
    slug: "{{fields.position}}-{{fields.title}}"
    summary: "{{title}} ({{position}})"
    editor:
      preview: false
    sortable_fields: [order, title, position]
    fields:
      - { label: "1. 배너명", name: title, widget: string }
      - label: "2. 노출 위치"
        name: position
        widget: select
        options:
          - { label: 메인 히어로(모바일 첫 화면), value: home_hero }
          - { label: 메인 상단, value: home_top }
          - { label: 메인 중간, value: home_middle }
          - { label: 지역 페이지 상단, value: area_top }
          - { label: 카테고리 페이지 상단, value: category_top }
          - { label: 업체 상세 상단, value: venue_top }
          - { label: 업체 상세 하단, value: venue_bottom }
      - { label: "3. 배너 이미지", name: image, widget: image }
      - { label: "4. 이미지 ALT", name: imageAlt, widget: string, hint: "예: 메인 상단 프로모션 배너 이미지" }
      - { label: "5. 배너 설명", name: description, widget: string, required: false }
      - { label: "6. 버튼 문구", name: buttonText, widget: string, required: false }
      - { label: "7. 클릭 링크", name: linkUrl, widget: string, required: false, default: "#", hint: "없으면 # 유지" }
      - { label: "8. 노출 여부", name: visible, widget: boolean, default: true }
      - { label: "9. 정렬 순서", name: order, widget: number, default: 100 }
      - { label: "10. 시작일", name: startDate, widget: datetime, required: false }
      - { label: "11. 종료일", name: endDate, widget: datetime, required: false }

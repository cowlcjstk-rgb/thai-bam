backend:
  name: github
  repo: cowlcjstk-rgb/thai-bam
  branch: main
  base_url: https://thai-bam.mkmdtkvypy.workers.dev
  auth_endpoint: oauth
  commit_messages:
    create: "cms(create): {{collection}} {{slug}}"
    update: "cms(update): {{collection}} {{slug}}"
    delete: "cms(delete): {{collection}} {{slug}}"
    uploadMedia: "cms(media): upload {{path}}"
    deleteMedia: "cms(media): delete {{path}}"

site_url: https://thai-bam.mkmdtkvypy.workers.dev
display_url: https://thai-bam.mkmdtkvypy.workers.dev
locale: ko
media_folder: "public/uploads"
public_folder: "/uploads"
publish_mode: simple

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: home
    label: 홈페이지 메인 설정
    folder: src/content/home
    create: false
    delete: false
    slug: "{{slug}}"
    summary: "홈페이지 히어로/카테고리 대표/SEO/FAQ"
    fields:
      - { label: 상단 라벨 문구, name: heroKicker, widget: string }
      - { label: 메인 제목, name: heroTitle, widget: string }
      - { label: 소개 문구, name: heroDescription, widget: text }
      - label: 카테고리 대표 글
        name: categoryHighlights
        widget: list
        required: false
        summary: "{{fields.category}} → {{fields.venueSlug}}"
        hint: "카테고리별로 메인에서 대표로 노출할 글을 지정하세요."
        fields:
          - label: 카테고리
            name: category
            widget: select
            options:
              - { label: "KTV & Karaoke", value: ktv-karaoke }
              - { label: "Spa & Massage", value: spa-massage }
              - { label: "Club Reservation", value: club-reservation }
              - { label: "VIP Guide", value: vip-guide }
          - label: 대표 글 선택
            name: venueSlug
            widget: relation
            collection: venues
            search_fields: [title, slug]
            value_field: slug
            display_fields: [title, slug]
      - { label: 가이드 정보 제목, name: seoBlockTitle, widget: string, required: false }
      - { label: 가이드 정보 본문 1, name: seoBlockParagraph1, widget: text, required: false }
      - { label: 가이드 정보 본문 2, name: seoBlockParagraph2, widget: text, required: false }
      - { label: 지역별 탐색 제목, name: areaSectionTitle, widget: string, required: false }
      - { label: 지역별 탐색 설명, name: areaSectionDescription, widget: text, required: false }
      - { label: 지역별 탐색 기본 접기, name: areaSectionCollapsed, widget: boolean, default: true, hint: "켜면 홈페이지 로드 시 지역별 탐색이 접힌 상태로 시작됩니다." }
      - label: 지역별 탐색 카드 설정
        name: areaExplorerAreas
        widget: list
        required: false
        summary: "{{fields.area}}"
        hint: "리스트 순서대로 카드가 노출됩니다. 대표 글을 비우면 해당 지역의 최신 글 3개가 자동 표시됩니다."
        fields:
          - label: 지역
            name: area
            widget: select
            options:
              - { label: Bangkok, value: bangkok }
              - { label: Pattaya, value: pattaya }
              - { label: Chiang Mai, value: chiang-mai }
          - label: 대표 글(선택)
            name: venueSlugs
            widget: relation
            required: false
            collection: venues
            search_fields: [title, slug, area, category]
            value_field: slug
            display_fields: [title, area, category]
            multiple: true
      - label: 자주 묻는 질문
        name: faqItems
        widget: list
        required: false
        summary: "{{fields.question}}"
        fields:
          - { label: 질문, name: question, widget: string }
          - { label: 답변, name: answer, widget: text }

  - name: venues
    label: 업체 글 관리
    folder: src/content/venues
    create: true
    slug: "{{fields.slug}}"
    summary: "{{title}} - {{area}} / {{category}}"
    fields:
      - { label: 업체명, name: title, widget: string }
      - label: URL 슬러그
        name: slug
        widget: string
        hint: "영문 소문자/숫자/하이픈만 입력 (예: sample-ktv-bangkok)"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "슬러그는 영문 소문자, 숫자, 하이픈(-)만 사용할 수 있습니다."

      - label: 지역
        name: area
        widget: select
        options:
          - { label: Bangkok, value: bangkok }
          - { label: Pattaya, value: pattaya }
          - { label: Chiang Mai, value: chiang-mai }

      - label: 카테고리
        name: category
        widget: select
        options:
          - { label: "KTV & Karaoke", value: ktv-karaoke }
          - { label: "Spa & Massage", value: spa-massage }
          - { label: "Club Reservation", value: club-reservation }
          - { label: "VIP Guide", value: vip-guide }

      - { label: 요약 소개, name: shortDescription, widget: text, hint: "40~180자 권장" }
      - { label: 상단 본문 소개, name: introBody, widget: text, required: false, hint: "상세 페이지 상단에 출력되는 SEO 본문" }

      - label: 이용 순서 타임라인
        name: usageSteps
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: 단계 제목, name: title, widget: string }
          - { label: 단계 설명, name: detail, widget: text }

      - { label: SEO 제목, name: seoTitle, widget: string }
      - { label: SEO 설명, name: seoDescription, widget: text }

      - { label: 대표 이미지, name: thumbnail, widget: image }
      - { label: 대표 이미지 ALT, name: thumbnailAlt, widget: string, hint: "이미지에 무엇이 보이는지 자연스럽게 설명해 주세요. 예: 방콕 KTV Sample 메인 라운지 전경" }
      - label: 대표 이미지 정렬
        name: thumbnailPosition
        widget: select
        default: center
        options:
          - { label: 상단 기준, value: top }
          - { label: 중앙 기준, value: center }
          - { label: 하단 기준, value: bottom }

      - label: 갤러리
        name: gallery
        widget: list
        required: false
        fields:
          - { label: 이미지, name: image, widget: image }
          - { label: 이미지 ALT, name: alt, widget: string, hint: "사진 장면을 구체적으로 작성해 주세요. 예: 파타야 스파 내부 테라피 룸" }

      - { label: 영업시간, name: openingHours, widget: string, required: false }
      - { label: 가격대, name: priceRange, widget: text, required: false, hint: "여러 줄 입력 가능\n예시:\n1번 옵션은 1000바트\n2번 옵션은 2000바트\n3번 옵션은 3000바트" }
      - { label: 위치 설명, name: addressText, widget: string, required: false }
      - { label: 구글맵 링크, name: googleMapUrl, widget: string, required: false, hint: "공유 링크 붙여넣기 가능 (예: https://maps.app.goo.gl/....)" }
      - { label: 위도(선택), name: latitude, widget: number, required: false, value_type: float, hint: "정확한 핀 고정을 원하면 입력하세요. 예: 13.7024493" }
      - { label: 경도(선택), name: longitude, widget: number, required: false, value_type: float, hint: "정확한 핀 고정을 원하면 입력하세요. 예: 100.58403" }

      - { label: 카카오 문의 링크, name: kakaoUrl, widget: string, required: false }
      - { label: 라인 문의 링크, name: lineUrl, widget: string, required: false }

      - { label: 추천 노출, name: featured, widget: boolean, default: false }
      - { label: 노출 여부, name: visible, widget: boolean, default: true }
      - { label: 정렬 순서, name: order, widget: number, default: 100 }
      - { label: 수정일, name: updatedAt, widget: datetime }
      - { label: 상세 본문, name: body, widget: markdown }

  - name: banners
    label: 홈페이지 배너 설정
    folder: src/content/banners
    create: true
    slug: "{{fields.position}}-{{fields.title}}"
    summary: "{{title}} ({{position}})"
    fields:
      - { label: 배너명, name: title, widget: string }

      - label: 노출 위치
        name: position
        widget: select
        options:
          - { label: 메인 히어로(모바일 첫 화면), value: home_hero }
          - { label: 메인 상단, value: home_top }
          - { label: 메인 중간, value: home_middle }
          - { label: 지역 페이지 상단, value: area_top }
          - { label: 카테고리 페이지 상단, value: category_top }
          - { label: 업체 상세 상단, value: venue_top }
          - { label: 업체 상세 하단, value: venue_bottom }

      - { label: 배너 이미지, name: image, widget: image }
      - { label: 이미지 ALT, name: imageAlt, widget: string, hint: "배너에서 보여주는 핵심 내용을 설명해 주세요. 예: 메인 상단 프로모션 배너 이미지" }
      - { label: 배너 설명, name: description, widget: string, required: false }
      - { label: 버튼 문구, name: buttonText, widget: string, required: false }
      - { label: 클릭 링크, name: linkUrl, widget: string, required: false, default: "#" }

      - { label: 노출 여부, name: visible, widget: boolean, default: true }
      - { label: 정렬 순서, name: order, widget: number, default: 100 }
      - { label: 시작일, name: startDate, widget: datetime, required: false }
      - { label: 종료일, name: endDate, widget: datetime, required: false }

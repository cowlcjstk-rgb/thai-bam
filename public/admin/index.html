<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Content Manager</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <script>
      (function () {
        const style = document.createElement("style");
        style.textContent = `
          .cms-apply-wrap{position:fixed;right:16px;bottom:16px;z-index:99999;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:540px}
          .cms-apply-btn{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid #2f3d5c;background:#ff34ae;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.28)}
          .cms-apply-btn[disabled]{opacity:.6;cursor:not-allowed}
          .cms-refresh-btn{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid #3d4b67;background:#101726;color:#e8efff;font-weight:700;cursor:pointer}
          .cms-pending-btn{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid #304266;background:#122035;color:#e6efff;font-weight:700;cursor:pointer}
          .cms-pending-modal{position:fixed;inset:0;z-index:100000;background:rgba(2,6,16,.72);display:none;align-items:center;justify-content:center;padding:20px}
          .cms-pending-modal.is-open{display:flex}
          .cms-pending-panel{width:min(860px,95vw);max-height:84vh;overflow:auto;background:#0c1320;border:1px solid #304266;border-radius:14px;padding:14px}
          .cms-pending-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
          .cms-pending-head h3{margin:0;color:#f4f8ff}
          .cms-pending-summary{font-size:.9rem;color:#bcd0f1}
          .cms-pending-actions{display:flex;gap:8px;flex-wrap:wrap}
          .cms-pending-list{display:grid;gap:8px}
          .cms-item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid #25334f;border-radius:10px;background:#0f182a}
          .cms-item-label{font-size:.9rem;color:#e3edff;word-break:break-all}
          .cms-item-meta{font-size:.78rem;color:#9fb4d7}
          .cms-item input{width:16px;height:16px}
          .cms-empty{padding:14px;border:1px dashed #2b3b5d;border-radius:10px;color:#b6c8e8;text-align:center}
        `;
        document.head.appendChild(style);

        const wrap = document.createElement("div");
        wrap.className = "cms-apply-wrap";

        const refreshBtn = document.createElement("button");
        refreshBtn.type = "button";
        refreshBtn.className = "cms-refresh-btn";
        refreshBtn.textContent = "목록 새로고침";
        refreshBtn.addEventListener("click", () => window.location.reload());

        const applyBtn = document.createElement("button");
        applyBtn.type = "button";
        applyBtn.className = "cms-apply-btn";
        applyBtn.textContent = "변경 적용";

        const pendingBtn = document.createElement("button");
        pendingBtn.type = "button";
        pendingBtn.className = "cms-pending-btn";
        pendingBtn.textContent = "변경대기중 확인";

        const modal = document.createElement("div");
        modal.className = "cms-pending-modal";
        modal.innerHTML = `
          <div class="cms-pending-panel">
            <div class="cms-pending-head">
              <h3>변경대기중 목록</h3>
              <button type="button" class="cms-refresh-btn" data-pending-close>닫기</button>
            </div>
            <p class="cms-pending-summary" data-pending-summary>불러오는 중...</p>
            <div class="cms-pending-actions">
              <button type="button" class="cms-refresh-btn" data-pending-refresh>목록 새로고침</button>
              <button type="button" class="cms-refresh-btn" data-pending-delete>선택 업체 일괄 삭제</button>
              <button type="button" class="cms-apply-btn" data-pending-apply>변경 적용</button>
            </div>
            <div class="cms-pending-list" data-pending-list></div>
          </div>
        `;
        document.body.appendChild(modal);

        const pendingSummary = modal.querySelector("[data-pending-summary]");
        const pendingList = modal.querySelector("[data-pending-list]");
        const pendingRefreshBtn = modal.querySelector("[data-pending-refresh]");
        const pendingDeleteBtn = modal.querySelector("[data-pending-delete]");
        const pendingApplyBtn = modal.querySelector("[data-pending-apply]");
        const pendingCloseBtn = modal.querySelector("[data-pending-close]");

        const renderPending = (data) => {
          pendingList.innerHTML = "";
          const items = Array.isArray(data?.items) ? data.items : [];
          pendingSummary.textContent = `대기 변경 ${items.length}건`;
          pendingBtn.textContent = `변경대기중 확인 (${items.length})`;
          if (items.length === 0) {
            const empty = document.createElement("div");
            empty.className = "cms-empty";
            empty.textContent = "현재 적용 대기중인 변경이 없습니다.";
            pendingList.appendChild(empty);
            return;
          }
          items.forEach((item) => {
            const row = document.createElement("label");
            row.className = "cms-item";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.disabled = !(item.collection === "venues" && item.venueSlug);
            if (item.venueSlug) checkbox.dataset.slug = item.venueSlug;

            const label = document.createElement("div");
            label.className = "cms-item-label";
            label.textContent = item.path || "(unknown)";

            const meta = document.createElement("div");
            meta.className = "cms-item-meta";
            meta.textContent = `${item.collection || "other"} · ${item.status || "-"}`;

            row.appendChild(checkbox);
            row.appendChild(label);
            row.appendChild(meta);
            pendingList.appendChild(row);
          });
        };

        const fetchPending = async () => {
          pendingSummary.textContent = "불러오는 중...";
          const res = await fetch("/admin/pending-changes", { credentials: "include" });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            throw new Error(data.message || "대기 목록 조회 실패");
          }
          renderPending(data);
          return data;
        };

        const runApply = async () => {
          const res = await fetch("/admin/apply-changes", {
            method: "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: "{}",
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.message || "변경 적용 실패");
          return data;
        };

        const runBulkDelete = async (slugs) => {
          const res = await fetch("/admin/bulk-delete-venues", {
            method: "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ slugs }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.message || "일괄 삭제 실패");
          return data;
        };

        applyBtn.addEventListener("click", async () => {
          const ok = window.confirm("저장된 변경사항을 한 번에 메인 사이트에 적용할까요?");
          if (!ok) return;
          applyBtn.disabled = true;
          applyBtn.textContent = "적용 중...";
          try {
            const data = await runApply();
            window.alert(data.message || "변경 적용 완료");
            await fetchPending().catch(() => {});
          } catch (error) {
            window.alert(error?.message || "변경 적용 중 오류가 발생했습니다.");
          } finally {
            applyBtn.disabled = false;
            applyBtn.textContent = "변경 적용";
          }
        });

        pendingBtn.addEventListener("click", async () => {
          modal.classList.add("is-open");
          try {
            await fetchPending();
          } catch (error) {
            pendingSummary.textContent = error?.message || "대기 목록 조회 오류";
          }
        });

        pendingCloseBtn.addEventListener("click", () => modal.classList.remove("is-open"));
        modal.addEventListener("click", (event) => {
          if (event.target === modal) modal.classList.remove("is-open");
        });

        pendingRefreshBtn.addEventListener("click", async () => {
          try {
            await fetchPending();
          } catch (error) {
            window.alert(error?.message || "목록 새로고침 실패");
          }
        });

        pendingApplyBtn.addEventListener("click", async () => {
          const ok = window.confirm("현재 대기중인 변경사항을 적용할까요?");
          if (!ok) return;
          pendingApplyBtn.disabled = true;
          pendingApplyBtn.textContent = "적용 중...";
          try {
            const data = await runApply();
            window.alert(data.message || "변경 적용 완료");
            await fetchPending();
          } catch (error) {
            window.alert(error?.message || "변경 적용 실패");
          } finally {
            pendingApplyBtn.disabled = false;
            pendingApplyBtn.textContent = "변경 적용";
          }
        });

        pendingDeleteBtn.addEventListener("click", async () => {
          const selected = Array.from(pendingList.querySelectorAll('input[type="checkbox"][data-slug]:checked'))
            .map((input) => input.dataset.slug)
            .filter(Boolean);
          if (selected.length === 0) {
            window.alert("삭제할 업체를 먼저 선택해 주세요.");
            return;
          }
          const ok = window.confirm(`선택한 업체 ${selected.length}건을 삭제할까요?`);
          if (!ok) return;
          pendingDeleteBtn.disabled = true;
          pendingDeleteBtn.textContent = "삭제 중...";
          try {
            const data = await runBulkDelete(selected);
            window.alert(data.message || "삭제 완료");
            await fetchPending();
          } catch (error) {
            window.alert(error?.message || "일괄 삭제 실패");
          } finally {
            pendingDeleteBtn.disabled = false;
            pendingDeleteBtn.textContent = "선택 업체 일괄 삭제";
          }
        });

        wrap.appendChild(refreshBtn);
        wrap.appendChild(pendingBtn);
        wrap.appendChild(applyBtn);
        document.body.appendChild(wrap);

        fetchPending().catch(() => {});
      })();
    </script>
  </body>
</html>

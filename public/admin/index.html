<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Content Manager</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <script>
      (function () {
        const style = document.createElement("style");
        style.textContent = `
          .cms-apply-wrap{position:fixed;right:16px;bottom:16px;z-index:99999;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:540px}
          .cms-apply-btn{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid #2f3d5c;background:#ff34ae;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.28)}
          .cms-apply-btn[disabled]{opacity:.6;cursor:not-allowed}
          .cms-refresh-btn{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid #3d4b67;background:#101726;color:#e8efff;font-weight:700;cursor:pointer}
          .cms-pending-btn{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid #304266;background:#122035;color:#e6efff;font-weight:700;cursor:pointer}
          .cms-pending-modal{position:fixed;inset:0;z-index:100000;background:rgba(2,6,16,.72);display:none;align-items:center;justify-content:center;padding:20px}
          .cms-pending-modal.is-open{display:flex}
          .cms-pending-panel{width:min(860px,95vw);max-height:84vh;overflow:auto;background:#0c1320;border:1px solid #304266;border-radius:14px;padding:14px}
          .cms-pending-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
          .cms-pending-head h3{margin:0;color:#f4f8ff}
          .cms-pending-summary{font-size:.9rem;color:#bcd0f1}
          .cms-pending-actions{display:flex;gap:8px;flex-wrap:wrap}
          .cms-pending-list{display:grid;gap:8px}
          .cms-section-title{margin:14px 0 8px;color:#eaf1ff;font-size:1rem}
          .cms-divider{height:1px;background:#2b3958;margin:12px 0}
          .cms-item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid #25334f;border-radius:10px;background:#0f182a}
          .cms-item-label{font-size:.9rem;color:#e3edff;word-break:break-all}
          .cms-item-meta{font-size:.78rem;color:#9fb4d7}
          .cms-item input{width:16px;height:16px}
          .cms-empty{padding:14px;border:1px dashed #2b3b5d;border-radius:10px;color:#b6c8e8;text-align:center}
          .cms-sidebar-pending-wrap{margin-top:8px}
          .cms-sidebar-pending{width:100%;min-height:38px;border:1px solid #304266;border-radius:10px;background:#0f1c30;color:#e6efff;font-weight:700;text-align:left;padding:0 12px;cursor:pointer}
          .cms-sidebar-pending:hover{background:#132744}
          .cms-venue-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
          .cms-venue-count{font-size:.86rem;color:#9db2d7}
          .cms-venue-entry{position:relative}
          .cms-venue-check{position:absolute;left:10px;top:10px;z-index:2;width:18px;height:18px}
          .cms-venue-entry-selected{outline:2px solid #ff34ae;outline-offset:1px;border-radius:10px}
        `;
        document.head.appendChild(style);

        const wrap = document.createElement("div");
        wrap.className = "cms-apply-wrap";

        const refreshBtn = document.createElement("button");
        refreshBtn.type = "button";
        refreshBtn.className = "cms-refresh-btn";
        refreshBtn.textContent = "목록 새로고침";
        refreshBtn.addEventListener("click", () => window.location.reload());

        const applyBtn = document.createElement("button");
        applyBtn.type = "button";
        applyBtn.className = "cms-apply-btn";
        applyBtn.textContent = "변경 적용";

        const pendingBtn = document.createElement("button");
        pendingBtn.type = "button";
        pendingBtn.className = "cms-pending-btn";
        pendingBtn.textContent = "변경대기중 확인";

        const modal = document.createElement("div");
        modal.className = "cms-pending-modal";
        modal.innerHTML = `
          <div class="cms-pending-panel">
            <div class="cms-pending-head">
              <h3>변경대기중 목록</h3>
              <button type="button" class="cms-refresh-btn" data-pending-close>닫기</button>
            </div>
            <p class="cms-pending-summary" data-pending-summary>불러오는 중...</p>
            <div class="cms-pending-actions">
              <button type="button" class="cms-refresh-btn" data-pending-refresh>목록 새로고침</button>
              <button type="button" class="cms-apply-btn" data-pending-apply>변경 적용</button>
            </div>
            <h4 class="cms-section-title">적용 대기 변경 파일</h4>
            <div class="cms-pending-list" data-pending-list></div>
            <div class="cms-divider"></div>
            <div class="cms-pending-actions">
              <button type="button" class="cms-refresh-btn" data-venues-refresh>등록 업체 목록 새로고침</button>
              <button type="button" class="cms-refresh-btn" data-venues-delete>선택 업체 일괄 삭제</button>
            </div>
            <h4 class="cms-section-title">등록된 업체 목록 (전체)</h4>
            <div class="cms-pending-list" data-venues-list></div>
          </div>
        `;
        document.body.appendChild(modal);

        const pendingSummary = modal.querySelector("[data-pending-summary]");
        const pendingList = modal.querySelector("[data-pending-list]");
        const pendingRefreshBtn = modal.querySelector("[data-pending-refresh]");
        const venuesList = modal.querySelector("[data-venues-list]");
        const venuesRefreshBtn = modal.querySelector("[data-venues-refresh]");
        const venuesDeleteBtn = modal.querySelector("[data-venues-delete]");
        const pendingApplyBtn = modal.querySelector("[data-pending-apply]");
        const pendingCloseBtn = modal.querySelector("[data-pending-close]");
        let currentPendingCount = 0;
        let pendingWarning = "";
        let venueWarning = "";
        const selectedVenueSlugs = new Set();
        let sidebarPendingBtn = null;
        let venueSelectMode = false;
        let venueToolbar = null;
        let venueToggleBtn = null;
        let venueDeleteBtn = null;
        let venueCountText = null;

        const isVenueListRoute = () => /^#\/collections\/venues(?:\/?$|\?.*)/.test(window.location.hash || "");

        const isVenueEntryHref = (href) => /#\/collections\/venues\/entries\//.test(href || "");

        const extractVenueSlugFromHref = (href) => {
          const match = String(href || "").match(/#\/collections\/venues\/entries\/([^/?#]+)/);
          if (!match) return "";
          try {
            return decodeURIComponent(match[1]).replace(/\.md$/i, "");
          } catch {
            return String(match[1]).replace(/\.md$/i, "");
          }
        };

        const updatePendingButtonLabel = (count) => {
          const label = `변경대기중 확인 (${count})`;
          pendingBtn.textContent = label;
          if (sidebarPendingBtn) sidebarPendingBtn.textContent = `변경 대기 중 (${count})`;
        };

        const updatePendingSummaryText = () => {
          const warnings = [pendingWarning, venueWarning].filter(Boolean);
          const warningText = warnings.length > 0 ? ` · ${warnings.join(" / ")}` : "";
          pendingSummary.textContent = `대기 변경 ${currentPendingCount}건${warningText}`;
        };

        const ensureSidebarPendingButton = () => {
          if (sidebarPendingBtn && document.body.contains(sidebarPendingBtn)) return;
          const collectionLinks = Array.from(document.querySelectorAll('a[href^="#/collections/"]'));
          if (collectionLinks.length === 0) return;
          const lastLink = collectionLinks[collectionLinks.length - 1];
          const mountItem = lastLink.closest("li,div");
          if (!mountItem || !mountItem.parentElement) return;

          const wrap = document.createElement("div");
          wrap.className = "cms-sidebar-pending-wrap";
          sidebarPendingBtn = document.createElement("button");
          sidebarPendingBtn.type = "button";
          sidebarPendingBtn.className = "cms-sidebar-pending";
          sidebarPendingBtn.dataset.cmsSidebarPending = "1";
          sidebarPendingBtn.textContent = "변경 대기 중";
          sidebarPendingBtn.addEventListener("click", async () => {
            modal.classList.add("is-open");
            try {
              await refreshAllLists();
            } catch (error) {
              pendingSummary.textContent = error?.message || "대기 목록 조회 오류";
            }
          });
          wrap.appendChild(sidebarPendingBtn);
          mountItem.parentElement.insertBefore(wrap, mountItem.nextSibling);
        };

        const updateVenueToolbarState = () => {
          if (!venueToolbar) return;
          const selectedCount = selectedVenueSlugs.size;
          if (venueCountText) venueCountText.textContent = `${selectedCount}개 선택`;
          if (venueDeleteBtn) venueDeleteBtn.disabled = selectedCount === 0 || !venueSelectMode;
          if (venueToggleBtn) venueToggleBtn.textContent = venueSelectMode ? "선택 모드 종료" : "선택 모드";
        };

        const clearVenueSelectionDecorations = () => {
          selectedVenueSlugs.clear();
          document.querySelectorAll("[data-cms-venue-check]").forEach((node) => node.remove());
          document.querySelectorAll("[data-cms-venue-entry]").forEach((entry) => {
            entry.classList.remove("cms-venue-entry-selected", "cms-venue-entry");
            entry.removeAttribute("data-cms-venue-entry");
          });
          updateVenueToolbarState();
        };

        const decorateVenueEntriesForSelection = () => {
          if (!venueSelectMode || !isVenueListRoute()) return;
          const entryLinks = Array.from(document.querySelectorAll('a[href*="#/collections/venues/entries/"]'));
          entryLinks.forEach((link) => {
            const href = link.getAttribute("href") || "";
            if (!isVenueEntryHref(href)) return;
            const slug = extractVenueSlugFromHref(href);
            if (!slug) return;
            if (link.querySelector("[data-cms-venue-check]")) {
              const exists = link.querySelector("[data-cms-venue-check]");
              if (exists) exists.checked = selectedVenueSlugs.has(slug);
              if (selectedVenueSlugs.has(slug)) link.classList.add("cms-venue-entry-selected");
              else link.classList.remove("cms-venue-entry-selected");
              return;
            }

            link.classList.add("cms-venue-entry");
            link.dataset.cmsVenueEntry = slug;

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "cms-venue-check";
            checkbox.dataset.cmsVenueCheck = "1";
            checkbox.checked = selectedVenueSlugs.has(slug);
            checkbox.addEventListener("click", (event) => {
              event.stopPropagation();
            });
            checkbox.addEventListener("change", (event) => {
              event.stopPropagation();
              if (checkbox.checked) selectedVenueSlugs.add(slug);
              else selectedVenueSlugs.delete(slug);
              if (checkbox.checked) link.classList.add("cms-venue-entry-selected");
              else link.classList.remove("cms-venue-entry-selected");
              updateVenueToolbarState();
            });

            link.addEventListener(
              "click",
              (event) => {
                if (venueSelectMode) {
                  const target = event.target;
                  if (target && target.closest && target.closest("[data-cms-venue-check]")) return;
                  event.preventDefault();
                }
              },
              true
            );

            link.prepend(checkbox);
            if (checkbox.checked) link.classList.add("cms-venue-entry-selected");
          });
          updateVenueToolbarState();
        };

        const ensureVenueToolbar = () => {
          if (venueToolbar && document.body.contains(venueToolbar)) return;
          venueToolbar = document.createElement("div");
          venueToolbar.className = "cms-venue-toolbar";
          venueToolbar.style.display = "none";

          venueToggleBtn = document.createElement("button");
          venueToggleBtn.type = "button";
          venueToggleBtn.className = "cms-refresh-btn";
          venueToggleBtn.textContent = "선택 모드";
          venueToggleBtn.addEventListener("click", () => {
            venueSelectMode = !venueSelectMode;
            if (!venueSelectMode) {
              clearVenueSelectionDecorations();
            } else {
              decorateVenueEntriesForSelection();
            }
            updateVenueToolbarState();
          });

          venueDeleteBtn = document.createElement("button");
          venueDeleteBtn.type = "button";
          venueDeleteBtn.className = "cms-refresh-btn";
          venueDeleteBtn.textContent = "선택 삭제";
          venueDeleteBtn.disabled = true;
          venueDeleteBtn.addEventListener("click", async () => {
            const slugs = Array.from(selectedVenueSlugs);
            if (slugs.length === 0) {
              window.alert("삭제할 업체를 먼저 선택해 주세요.");
              return;
            }
            const ok = window.confirm(`선택한 업체 ${slugs.length}건을 삭제할까요?`);
            if (!ok) return;
            venueDeleteBtn.disabled = true;
            venueDeleteBtn.textContent = "삭제 중...";
            try {
              const data = await runBulkDelete(slugs);
              window.alert(data.message || "삭제 완료");
              venueSelectMode = false;
              clearVenueSelectionDecorations();
              await refreshAllLists().catch(() => {});
              window.location.reload();
            } catch (error) {
              window.alert(error?.message || "선택 삭제 실패");
            } finally {
              venueDeleteBtn.textContent = "선택 삭제";
              updateVenueToolbarState();
            }
          });

          venueCountText = document.createElement("span");
          venueCountText.className = "cms-venue-count";
          venueCountText.textContent = "0개 선택";

          venueToolbar.appendChild(venueToggleBtn);
          venueToolbar.appendChild(venueDeleteBtn);
          venueToolbar.appendChild(venueCountText);

          document.body.appendChild(venueToolbar);
        };

        const syncVenueToolbarPlacement = () => {
          ensureVenueToolbar();
          if (!venueToolbar) return;
          if (!isVenueListRoute()) {
            venueToolbar.style.display = "none";
            if (venueSelectMode) {
              venueSelectMode = false;
              clearVenueSelectionDecorations();
            }
            return;
          }

          const title = Array.from(document.querySelectorAll("h1,h2,h3")).find((el) => String(el.textContent || "").includes("업체 글 관리"));
          if (title && title.parentElement) {
            if (venueToolbar.parentElement !== title.parentElement) {
              title.parentElement.appendChild(venueToolbar);
            }
          } else if (venueToolbar.parentElement !== document.body) {
            document.body.appendChild(venueToolbar);
          }
          venueToolbar.style.display = "flex";
          if (venueSelectMode) decorateVenueEntriesForSelection();
          updateVenueToolbarState();
        };

        const renderPending = (data) => {
          pendingList.innerHTML = "";
          const items = Array.isArray(data?.items) ? data.items : [];
          currentPendingCount = items.length;
          pendingWarning = data?.warning ? `비교 조회 제한: ${data.warning}` : "";
          updatePendingSummaryText();
          updatePendingButtonLabel(items.length);
          if (items.length === 0) {
            const empty = document.createElement("div");
            empty.className = "cms-empty";
            empty.textContent = "현재 적용 대기중인 변경이 없습니다.";
            pendingList.appendChild(empty);
            return;
          }
          items.forEach((item) => {
            const row = document.createElement("label");
            row.className = "cms-item";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.disabled = !(item.collection === "venues" && item.venueSlug);
            if (item.venueSlug) checkbox.dataset.slug = item.venueSlug;

            const label = document.createElement("div");
            label.className = "cms-item-label";
            label.textContent = item.path || "(unknown)";

            const meta = document.createElement("div");
            meta.className = "cms-item-meta";
            meta.textContent = `${item.collection || "other"} · ${item.status || "-"}`;

            row.appendChild(checkbox);
            row.appendChild(label);
            row.appendChild(meta);
            pendingList.appendChild(row);
          });
        };

        const fetchPending = async () => {
          pendingSummary.textContent = "불러오는 중...";
          const res = await fetch("/admin/pending-changes", { credentials: "include" });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            throw new Error(data.message || "대기 목록 조회 실패");
          }
          renderPending(data);
          return data;
        };

        const renderVenues = (data) => {
          venuesList.innerHTML = "";
          const items = Array.isArray(data?.items) ? data.items : [];
          if (items.length === 0) {
            const empty = document.createElement("div");
            empty.className = "cms-empty";
            empty.textContent = "등록된 업체가 없습니다.";
            venuesList.appendChild(empty);
            return;
          }
          items.forEach((item) => {
            const row = document.createElement("label");
            row.className = "cms-item";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.dataset.slug = item.slug || "";

            const label = document.createElement("div");
            label.className = "cms-item-label";
            label.textContent = item.title || item.slug || "(untitled)";

            const meta = document.createElement("div");
            meta.className = "cms-item-meta";
            meta.textContent = `${item.slug || "-"} · ${item.area || "-"} · ${item.category || "-"}`;

            row.appendChild(checkbox);
            row.appendChild(label);
            row.appendChild(meta);
            venuesList.appendChild(row);
          });
        };

        const fetchVenues = async () => {
          const res = await fetch("/admin/venues-list", { credentials: "include" });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.message || "업체 목록 조회 실패");
          renderVenues(data);
          venueWarning = data?.warning ? `업체 목록 제한: ${data.warning}` : "";
          updatePendingSummaryText();
          return data;
        };

        const runApply = async () => {
          const res = await fetch("/admin/apply-changes", {
            method: "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: "{}",
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.message || "변경 적용 실패");
          return data;
        };

        const runBulkDelete = async (slugs) => {
          const res = await fetch("/admin/bulk-delete-venues", {
            method: "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ slugs }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.message || "일괄 삭제 실패");
          return data;
        };

        const refreshAllLists = async () => {
          const errors = [];
          pendingWarning = "";
          venueWarning = "";
          await fetchPending().catch((error) => {
            errors.push(error?.message || "대기 목록 조회 실패");
            pendingWarning = `대기 목록 실패: ${error?.message || "조회 실패"}`;
          });
          await fetchVenues().catch((error) => {
            errors.push(error?.message || "업체 목록 조회 실패");
            venueWarning = `업체 목록 실패: ${error?.message || "조회 실패"}`;
            renderVenues({ items: [] });
          });
          updatePendingSummaryText();
          return { ok: errors.length === 0, errors };
        };

        applyBtn.addEventListener("click", async () => {
          const ok = window.confirm("저장된 변경사항을 한 번에 메인 사이트에 적용할까요?");
          if (!ok) return;
          applyBtn.disabled = true;
          applyBtn.textContent = "적용 중...";
          try {
            const data = await runApply();
            window.alert(data.message || "변경 적용 완료");
            await refreshAllLists().catch(() => {});
          } catch (error) {
            window.alert(error?.message || "변경 적용 중 오류가 발생했습니다.");
          } finally {
            applyBtn.disabled = false;
            applyBtn.textContent = "변경 적용";
          }
        });

        pendingBtn.addEventListener("click", async () => {
          modal.classList.add("is-open");
          await refreshAllLists();
        });

        pendingCloseBtn.addEventListener("click", () => modal.classList.remove("is-open"));
        modal.addEventListener("click", (event) => {
          if (event.target === modal) modal.classList.remove("is-open");
        });

        pendingRefreshBtn.addEventListener("click", async () => {
          await refreshAllLists();
        });

        pendingApplyBtn.addEventListener("click", async () => {
          const ok = window.confirm("현재 대기중인 변경사항을 적용할까요?");
          if (!ok) return;
          pendingApplyBtn.disabled = true;
          pendingApplyBtn.textContent = "적용 중...";
          try {
            const data = await runApply();
            window.alert(data.message || "변경 적용 완료");
            await refreshAllLists();
          } catch (error) {
            window.alert(error?.message || "변경 적용 실패");
          } finally {
            pendingApplyBtn.disabled = false;
            pendingApplyBtn.textContent = "변경 적용";
          }
        });

        venuesRefreshBtn.addEventListener("click", async () => {
          try {
            await fetchVenues();
          } catch (error) {
            window.alert(error?.message || "업체 목록 조회 실패");
          }
        });

        venuesDeleteBtn.addEventListener("click", async () => {
          const selected = Array.from(venuesList.querySelectorAll('input[type="checkbox"][data-slug]:checked'))
            .map((input) => input.dataset.slug)
            .filter(Boolean);
          if (selected.length === 0) {
            window.alert("삭제할 업체를 먼저 선택해 주세요.");
            return;
          }
          const ok = window.confirm(`선택한 업체 ${selected.length}건을 삭제할까요?`);
          if (!ok) return;
          venuesDeleteBtn.disabled = true;
          venuesDeleteBtn.textContent = "삭제 중...";
          try {
            const data = await runBulkDelete(selected);
            window.alert(data.message || "삭제 완료");
            await refreshAllLists();
          } catch (error) {
            window.alert(error?.message || "일괄 삭제 실패");
          } finally {
            venuesDeleteBtn.disabled = false;
            venuesDeleteBtn.textContent = "선택 업체 일괄 삭제";
          }
        });

        wrap.appendChild(refreshBtn);
        wrap.appendChild(pendingBtn);
        wrap.appendChild(applyBtn);
        document.body.appendChild(wrap);

        window.addEventListener("hashchange", () => {
          syncVenueToolbarPlacement();
          ensureSidebarPendingButton();
        });

        let syncScheduled = false;
        const scheduleSync = () => {
          if (syncScheduled) return;
          syncScheduled = true;
          requestAnimationFrame(() => {
            syncScheduled = false;
            ensureSidebarPendingButton();
            syncVenueToolbarPlacement();
            if (venueSelectMode) decorateVenueEntriesForSelection();
          });
        };

        const domObserver = new MutationObserver(() => {
          scheduleSync();
        });
        domObserver.observe(document.body, { childList: true, subtree: true });

        ensureSidebarPendingButton();
        syncVenueToolbarPlacement();
        refreshAllLists().catch(() => {});
      })();
    </script>
  </body>
</html>
